<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
  </head>
  <body >

   <div class="flex items-center justify-center h-screen bg-[#10172a]">
        <!-- Card Starts Here -->
      <div class="max-w-md mx-auto bg-white rounded-xl shadow-xl p-6 h-120">

        <div class="bg-green-500 rounded-xl w-90 h-full flex flex-col p-4">
            <h1 class="text-2xl font-semibold mb-4 text-center p-7">Timer</h1>
        
          <!-- Input Fields -->
        <div class="flex gap-4 justify-center mb-9">
            <input type="number" id="hours" placeholder="HH" min="0" max="99" class="w-20 h-20 p-3 border rounded-lg text-center font-bold font-mono text-3xl focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <input type="number" id="mins" placeholder="MM" min="0" max="59" class="w-20 h-20 p-3 border rounded-lg text-center font-bold font-mono text-3xl focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <input type="number" id="secs" placeholder="SS" min="0" max="59" class="w-20 h-20 p-3 border rounded-lg text-center font-bold font-mono text-3xl focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

      

        <div class="justify-center items-center flex mt-15">

            <button class="mt-6 bg-white text-green-500 rounded-lg px-7 py-3 bg-blue-500 rounded hover:bg-green-100 transition">Start</button>
            
            
        </div>

          <!-- Card Ends Here -->
      </div>  
    </div>



  </body>
</html>
