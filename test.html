<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Set Timer</h1>
        
        <!-- Input Fields -->
        <div class="flex gap-2 justify-center mb-6">
            <input type="number" id="hours" placeholder="HH" min="0" max="99" class="w-16 p-3 border rounded-lg text-center font-mono text-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <input type="number" id="mins" placeholder="MM" min="0" max="59" class="w-16 p-3 border rounded-lg text-center font-mono text-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <input type="number" id="secs" placeholder="SS" min="0" max="59" class="w-16 p-3 border rounded-lg text-center font-mono text-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <!-- Start Button -->
        <button id="startBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-150">
            Start Timer
        </button>

        <!-- Display Area -->
        <div id="display" class="mt-8 text-4xl font-mono font-bold text-gray-900 hidden">
            <span id="dHours">00</span>:<span id="dMins">00</span>:<span id="dSecs">00</span>
        </div>
    </div>

    <script>
        let countdownInterval;

        document.getElementById('startBtn').addEventListener('click', function() {
            // Get input values
            let h = parseInt(document.getElementById('hours').value) || 0;
            let m = parseInt(document.getElementById('mins').value) || 0;
            let s = parseInt(document.getElementById('secs').value) || 0;

            // Convert to total seconds
            let totalSeconds = (h * 3600) + (m * 60) + s;

            if (totalSeconds <= 0) return alert("Please enter a valid time");

            // Hide inputs, show display
            document.getElementById('startBtn').classList.add('hidden');
            document.querySelector('.gap-2').classList.add('hidden');
            document.getElementById('display').classList.remove('hidden');

            // Update display immediately
            updateDisplay(totalSeconds);

            // Start Timer
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                totalSeconds--;
                updateDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(countdownInterval);
                    alert("Time's up!");
                    resetUI();
                }
            }, 1000);
        });

        function updateDisplay(total) {
            let h = Math.floor(total / 3600);
            let m = Math.floor((total % 3600) / 60);
            let s = total % 60;

            document.getElementById('dHours').textContent = String(h).padStart(2, '0');
            document.getElementById('dMins').textContent = String(m).padStart(2, '0');
            document.getElementById('dSecs').textContent = String(s).padStart(2, '0');
        }

        function resetUI() {
            document.getElementById('startBtn').classList.remove('hidden');
            document.querySelector('.gap-2').classList.remove('hidden');
            document.getElementById('display').classList.add('hidden');
        }
    </script>
</body>
</html>
